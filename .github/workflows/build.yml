# Builds HomeKVM.exe on GitHub's Windows machines.
# - Every push to main: the exe is kept as a run artifact for 30 days.
# - A version tag (v0.5.0, v0.6.0, ...): the exe is also published as a GitHub Release.
# This is the build with keyboard and mouse sharing.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      # Publishing a release needs write access; plain builds only read.
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - name: Cache build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-${{ hashFiles('Cargo.lock') }}

      - name: Build
        run: cargo build --release --locked

      - name: Check the exe's manifest
        shell: pwsh
        run: |
          $text = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes("target/release/HomeKVM.exe"))
          if (-not $text.Contains('asInvoker')) { throw "The application manifest is missing from HomeKVM.exe" }
          "Application manifest embedded."

      - name: Upload HomeKVM.exe
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: HomeKVM-${{ github.sha }}
          path: target/release/HomeKVM.exe
          retention-days: 30

      # Code signing through SignPath Foundation (see SIGNING.md). Release tags only, and
      # only once the repository variable SIGNPATH_ORGANIZATION_ID is set; until then
      # releases are published unsigned. Each request waits for approval on SignPath.
      - name: Sign with SignPath
        id: sign
        if: startsWith(github.ref, 'refs/tags/v') && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'HomeKVM' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          # Empty uses the project's default artifact configuration.
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed

      - name: Check the signature
        if: steps.sign.outcome == 'success'
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature signed/HomeKVM.exe
          if ($sig.Status -ne 'Valid') { throw "Signature is $($sig.Status)" }
          "Signed by: $($sig.SignerCertificate.Subject)"

      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} doesn't match Cargo.toml version $version" }

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The signed exe when signing ran, otherwise the unsigned build.
          $exe = if (Test-Path signed/HomeKVM.exe) { "signed/HomeKVM.exe" } else { "target/release/HomeKVM.exe" }
          # The app's updater checks downloads against this.
          (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower() | Set-Content HomeKVM.exe.sha256 -NoNewline
          gh release create "${{ github.ref_name }}" $exe HomeKVM.exe.sha256 `
            --title "HomeKVM ${{ github.ref_name }}" `
            --notes-file .github/release-notes.md

      # ---- Microsoft Store (see STORE.md) ----------------------------------------------
      # Every build makes the Store package, so problems show up early. Until the
      # repository variables from Partner Center exist, it uses placeholder identity values.
      - name: Build the Microsoft Store package
        shell: pwsh
        env:
          IDENTITY_NAME: ${{ vars.MSSTORE_IDENTITY_NAME }}
          PUBLISHER: ${{ vars.MSSTORE_PUBLISHER }}
          PUBLISHER_DISPLAY_NAME: ${{ vars.MSSTORE_PUBLISHER_DISPLAY_NAME }}
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $layout = "target/msix"
          Remove-Item $layout, store-out -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory $layout, store-out | Out-Null
          cargo run --release --locked --example store_assets -- "$layout/Assets"
          if ($LASTEXITCODE -ne 0) { throw "Couldn't make the Store images" }
          # The signed exe when signing ran, otherwise the unsigned build.
          $exe = if (Test-Path signed/HomeKVM.exe) { "signed/HomeKVM.exe" } else { "target/release/HomeKVM.exe" }
          Copy-Item $exe "$layout/HomeKVM.exe"
          $value = { param($v, $fallback) if ([string]::IsNullOrWhiteSpace($v)) { $fallback } else { $v } }
          $manifest = (Get-Content packaging/AppxManifest.xml -Raw).
            Replace('{VERSION}', "$version.0").
            Replace('{IDENTITY_NAME}', (& $value $env:IDENTITY_NAME 'HomeKVM.Placeholder')).
            Replace('{PUBLISHER}', (& $value $env:PUBLISHER 'CN=HomeKVMPlaceholder')).
            Replace('{PUBLISHER_DISPLAY_NAME}', (& $value $env:PUBLISHER_DISPLAY_NAME 'Saugata Datta'))
          Set-Content "$layout/AppxManifest.xml" $manifest -Encoding utf8
          $makeappx = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\makeappx.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          & $makeappx.FullName pack /d $layout /p "store-out/HomeKVM-$version.msix" /o
          if ($LASTEXITCODE -ne 0) { throw "makeappx couldn't build the package" }
          # Partner Center takes an .msixupload: a zip holding the .msix.
          Compress-Archive "store-out/HomeKVM-$version.msix" "store-out/HomeKVM-$version.zip" -Force
          Move-Item "store-out/HomeKVM-$version.zip" "store-out/HomeKVM-$version.msixupload" -Force
          Remove-Item "store-out/HomeKVM-$version.msix"
          "Store package: store-out/HomeKVM-$version.msixupload"

      - name: Upload the Store package
        uses: actions/upload-artifact@v7
        with:
          name: HomeKVM-store-${{ github.sha }}
          path: store-out/*.msixupload
          retention-days: 30

      # Submitting needs the one-time Partner Center setup in STORE.md; skipped until the
      # repository variable MSSTORE_PRODUCT_ID exists.
      - name: Set up the Microsoft Store CLI
        if: startsWith(github.ref, 'refs/tags/v') && vars.MSSTORE_PRODUCT_ID != ''
        uses: microsoft/microsoft-store-apppublisher@v1.4

      - name: Submit to the Microsoft Store
        if: startsWith(github.ref, 'refs/tags/v') && vars.MSSTORE_PRODUCT_ID != ''
        shell: pwsh
        env:
          TENANT_ID: ${{ secrets.PARTNER_CENTER_TENANT_ID }}
          SELLER_ID: ${{ secrets.PARTNER_CENTER_SELLER_ID }}
          CLIENT_ID: ${{ secrets.PARTNER_CENTER_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.PARTNER_CENTER_CLIENT_SECRET }}
          PRODUCT_ID: ${{ vars.MSSTORE_PRODUCT_ID }}
        run: |
          msstore reconfigure --tenantId $env:TENANT_ID --sellerId $env:SELLER_ID --clientId $env:CLIENT_ID --clientSecret $env:CLIENT_SECRET
          if ($LASTEXITCODE -ne 0) { throw "Couldn't sign in to Partner Center" }
          # Uploads the package to a new submission and sends it to certification.
          msstore publish store-out --inputDirectory store-out --appId $env:PRODUCT_ID
          if ($LASTEXITCODE -ne 0) { throw "The Store submission failed" }
