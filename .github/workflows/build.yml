# Builds HomeKVM.exe on GitHub's Windows machines on every push to main (or on demand).
# This is the build with keyboard and mouse sharing; download it from the run's
# "Artifacts" on the PCs you'll use it on.
name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - name: Cache build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-${{ hashFiles('Cargo.lock') }}

      - name: Build
        run: cargo build --release --locked

      - name: Upload HomeKVM.exe
        uses: actions/upload-artifact@v7
        with:
          name: HomeKVM-${{ github.sha }}
          path: target/release/HomeKVM.exe
          retention-days: 30
