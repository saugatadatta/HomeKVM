[package]
name = "homekvm"
version = "0.8.0"
edition = "2021"
description = "Share one keyboard and mouse, the clipboard and files across your home PCs"
license = "MIT"
publish = false

[[bin]]
name = "HomeKVM"
path = "src/main.rs"

[features]
default = ["input"]
# Keyboard and mouse sharing: global input hooks and input injection. Build without it
# (cargo build --no-default-features) on PCs where such hooks aren't allowed.
input = []

[dependencies]
eframe = "0.29"
mdns-sd = "0.13"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "ring", "log"] }
raw-window-handle = "0.6"
rcgen = "0.13"
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "net", "sync", "time", "macros", "fs", "io-util"] }
toml = "0.8"
tray-icon = "0.19"
# COM objects for pasting files (IDataObject, IStream); see vfiles.rs.
windows-core = "0.58"
windows = { version = "0.58", features = [
    "implement",
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_SystemServices",
    "Win32_UI_Shell",
] }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Networking_WinHttp",
    "Win32_Security_WinTrust",
    "Win32_UI_Controls",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "2.5"

# Small release exe: optimize for size, link-time optimization, no debug symbols.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
